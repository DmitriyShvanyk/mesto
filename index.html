<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Mesto</title>
  <link rel="stylesheet" href="./css/main.982be3bcbe1f5735e6d5.css?8b5a8f7236784e57ce54">
</head>

<body>
  <div class="root">
    
    <!-- Preloader -->
    <div class="preloader">
      <div class="preloader__icon"></div>
    </div>
    <!-- End Preloader -->

    <!-- Header -->
    <header class="header root__section">
      <a href="/" class="logo">Mesto</a>
    </header>
    <!-- End Header -->

    <!-- Profile -->
    <div class="profile root__section">
      <div class="user-info">
        <div class="user-info__photo"></div>
        <div class="user-info__data">
          <h1 class="user-info__name">DS</h1>
          <p class="user-info__job">User text info</p>
          <button class="user-info__edit js-btn">Edit</button>
        </div>
        <button class="button user-info__button js-btn">+</button>
      </div>
    </div>
    <!-- End Profile -->

    <!-- Places -->
    <div class="places-list root__section">

      <h2 class="no-cards no-cards_hidden">No cards added</h2>

      <div class="places-cards__info">
        <div class="places-cards__count">Number of cards - 0</div>
        <div class="places-cards__count places-cards__count--my">The number of my cards is 0</div>
      </div>

      <div class="place-cards"></div>

    </div>
    <!-- End Places -->

    <!-- Popup Update Avatar -->
    <div class="popup popup--update-avatar">
      <div class="popup__overlay"></div>
      <div class="popup__content">
        <button class="popup__close">Close</button>
        <h3 class="popup__title">Update Avatar</h3>
        <form class="popup__form popup__form--update-avatar" name="update-avatar">          
          <div class="popup__item">
            <input type="url" name="avatar" class="popup__input popup__input_type_link-avatar"
              placeholder="Link to the image"
              pattern="^(?:(?:https?|HTTPS?|ftp|FTP):\/\/)(?:\S+(?::\S*)?@)?(?:(?!(?:10|127)(?:\.\d{1,3}){3})(?!(?:169\.254|192\.168)(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-zA-Z\u00a1-\uffff0-9]-*)*[a-zA-Z\u00a1-\uffff0-9]+)(?:\.(?:[a-zA-Z\u00a1-\uffff0-9]-*)*[a-zA-Z\u00a1-\uffff0-9]+)*(?:\.(?:[a-zA-Z\u00a1-\uffff]{2,}))\.?)(?::\d{2,5})?(?:[/?#]\S*)?$"
              required>
          </div>
          <button type="submit" class="button popup__button popup__button--update-avatar">Update</button>
        </form>
      </div>
    </div>
    <!-- End Popup Update Avatar -->

    <!-- Popup Add Place -->
    <div class="popup popup--add-place">
      <div class="popup__overlay"></div>
      <div class="popup__content">
        <button class="popup__close">Close</button>
        <h3 class="popup__title">New place</h3>
        <form class="popup__form popup__form--add-place" name="new">
          <div class="popup__item">
            <input type="text" minlength="2" maxlength="30" name="name" class="popup__input popup__input_type_name"
              placeholder="Name" required>
          </div>
          <div class="popup__item">
            <input type="url" name="link" class="popup__input popup__input_type_link-url"
              placeholder="Link to the image"
              pattern="^(?:(?:https?|HTTPS?|ftp|FTP):\/\/)(?:\S+(?::\S*)?@)?(?:(?!(?:10|127)(?:\.\d{1,3}){3})(?!(?:169\.254|192\.168)(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-zA-Z\u00a1-\uffff0-9]-*)*[a-zA-Z\u00a1-\uffff0-9]+)(?:\.(?:[a-zA-Z\u00a1-\uffff0-9]-*)*[a-zA-Z\u00a1-\uffff0-9]+)*(?:\.(?:[a-zA-Z\u00a1-\uffff]{2,}))\.?)(?::\d{2,5})?(?:[/?#]\S*)?$"
              required>
          </div>
          <button type="submit" class="button popup__button popup__button--add-place">+</button>
        </form>
      </div>
    </div>
    <!-- End Popup Add Place -->

    <!-- Popup Edit -->
    <div class="popup popup--edit">
      <div class="popup__overlay"></div>
      <div class="popup__content">
        <button class="popup__close">Close</button>
        <h3 class="popup__title">Edit profile</h3>
        <form class="popup__form popup__form--edit" name="edit">
          <div class="popup__item">
            <input type="text" minlength="2" maxlength="30" name="userName" class="popup__input popup__input_user-name"
              placeholder="Name" required>
          </div>
          <div class="popup__item">
            <input type="text" minlength="2" maxlength="30" name="userJob" class="popup__input popup__input_user-job"
              placeholder="About me" required>
          </div>
          <button type="submit" class="button popup__button popup__button--edit">Save</button>
        </form>
      </div>
    </div>
    <!-- End Popup Edit -->

  </div>

  <!--scripts.begin-->
  <script src="./js/main.0c900a10639ed22446fd.js?8b5a8f7236784e57ce54"></script>
  <!--scripts.end-->

</body>

</html>
